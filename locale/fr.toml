"EditorDialog.label.description" = "Saisissez le titre et l'URL du moteur de recherche. Les titres doivent comporter au moins deux caractères (hors espaces) et ne doivent pas correspondre au titre d'un moteur de recherche existant.\n\nLors de la saisie de l'URL, la macro **%search%** doit être incluse. Celle-ci sera remplacée par la liste des mots-clés séparés par des signes « + » lorsque l'URL sera transmise à votre navigateur pour affichage."
