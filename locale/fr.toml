"qt.SearchEngineLookupOptionsPage.page.text" = "Le plugin « Search Engine Lookup » vous permet de lancer une recherche sur un moteur de recherche dans votre navigateur pour un cluster, à partir du menu qui s'affiche lorsque vous cliquez avec le bouton droit de la souris sur ce cluster. Ces paramètres vous permettent de choisir le moteur de recherche à utiliser pour la recherche, ainsi que d'éventuels termes de recherche supplémentaires."
"qt.SearchEngineLookupOptionsPage.page.title" = "Recherche sur les moteurs de recherche"
"qt.SearchEngineLookupOptionsPage.window.title" = "Paramètres de recherche"
"qt.SearchEngineLookupOptionsPage.section.providers.title" = "Fournisseurs de moteurs de recherche"
"qt.SearchEngineLookupOptionsPage.section.words.text" = "Par défaut, les paramètres de recherche utilisés sont le nom de l'artiste et le titre de l'album, s'ils sont disponibles dans les métadonnées. Vous avez la possibilité d'ajouter des mots supplémentaires aux paramètres de recherche (par exemple : album).\n\nLes mots supplémentaires doivent être saisis ci-dessous et séparés par des espaces."
