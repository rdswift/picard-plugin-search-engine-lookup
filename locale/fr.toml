"manifest.description" = "Ajoute une option accessible par un clic droit sur un groupe permettant de rechercher des informations sur un album à l'aide d'un moteur de recherche dans une fenêtre de navigateur."
"manifest.long_description" = "Ce plugin ajoute une option accessible par un clic droit sur un groupe, permettant de rechercher ce groupe à l'aide d'un moteur de recherche dans une\nfenêtre de navigateur. Il propose également une option accessible par un clic droit sur les albums et les morceaux dans le volet « Album » situé à droite, permettant de\nrechercher sur un moteur de recherche la pochette associée à l'album ou au morceau sélectionné.\n\nLorsque vous cliquez avec le bouton droit sur le groupe, l'album ou le morceau, l'option de recherche se trouve dans la section « Plugins » de la liste contextuelle.\n"
